name: 'Issue Labeler'bot kaue
on:[![Issue Labeler](https://github.com/discordjs/discord.js/actions/workflows/issue-triage.yml/badge.svg?branch=v14&event=create)](https://github.com/discordjs/discord.js/actions/workflows/issue-triage.yml)
  issues:
    types: [opened]
jobs:
  issue-triage:
    runs-on: ubuntu-latest
    steps:
      - uses: github/issue-labeler@v3.4
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          configuration-path: .github/issue-labeler.yml
          not-before: 2023-01-13T10:25:03.847Z
          enable-versioned-regex: 0
/filas
